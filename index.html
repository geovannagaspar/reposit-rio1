
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <title>Pokémon Cards</title>
</head>

<body>

    <main>

        <h1>⚡ Buscar Pokémon</h1>

        <form id="formPoke">

            <input
                type="number"
                id="idPoke"
                placeholder="Digite o ID do Pokémon"
                min="1"
                required
            >

            <button type="submit">Buscar</button>

        </form>

        <p id="msg"></p>

        <div id="resultado" class="carta">

            <div class="topo-carta">
                <span id="idCarta">Nº 000</span>
                <span class="tipoCarta">POKÉMON</span>
            </div>

            <h2 id="nomePokemon"></h2>

            <div class="imagem-carta">
                <img
                    src=""
                    alt="Imagem do Pokémon"
                    id="imgPoke"
                >
            </div>

            <div class="informacoes">

                <p>⭐ Experiência: <span id="basePoke"></span></p>

                <p>📏 Altura: <span id="alturaPoke"></span></p>

                <p>⚖️ Peso: <span id="pesoPoke"></span></p>

            </div>

            <div class="rodape-carta">
                POKÉMON COLLECTION
            </div>

        </div>

    </main>

    <script src="main.js"></script>

</body>
</html>
